# Monitoring override для docker-compose.yml.
# Добавляет Loki и Grafana, но НЕ создаёт второй LogCollector.
#
# Запуск:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.monitoring.yml \
#     up -d --build

x-monitoring-logs: &monitoring-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  logcollector:
    environment:
      # Environment provider добавляет второй элемент в массив LogSinks.
      # SQLite остаётся индексом 0 и обязательным PRIMARY sink.
      LogSinks__1__Type: Loki
      LogSinks__1__Endpoint: http://loki:3100
      LogSinks__1__Labels__app: logcollector
      LogSinks__1__Labels__environment: docker

    depends_on:
      - loki

  # Одноразово назначает владельца persistent volume непривилегированному Loki.
  loki-volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /loki && chown -R 10001:10001 /loki"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - loki-data:/loki
    networks:
      - logcollector-net
    logging: *monitoring-logs

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.3}
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    restart: unless-stopped
    init: true

    depends_on:
      loki-volume-init:
        condition: service_completed_successfully

    # Loki single-tenant и без auth, поэтому порт намеренно не публикуется.
    expose:
      - "3100"

    volumes:
      - type: bind
        source: ./deploy/loki/loki-config.yaml
        target: /etc/loki/loki-config.yaml
        read_only: true
      - loki-data:/loki

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${LOKI_MEMORY_LIMIT:-768m}

    networks:
      - logcollector-net
    logging: *monitoring-logs

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.4.0}
    user: "472:0"
    restart: unless-stopped
    init: true

    depends_on:
      - loki

    ports:
      # По умолчанию UI доступен только с Docker host.
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_MODE: console
      GF_PATHS_LOGS: /tmp/grafana-logs

    secrets:
      - grafana_admin_password

    volumes:
      - grafana-data:/var/lib/grafana
      - type: bind
        source: ./deploy/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./deploy/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}

    networks:
      - logcollector-net
    logging: *monitoring-logs

secrets:
  grafana_admin_password:
    file: ${GRAFANA_PASSWORD_FILE:-./secrets/grafana_admin_password.txt}

volumes:
  loki-data:
    name: ${LOKI_DATA_VOLUME:-logcollector-loki-data}
  grafana-data:
    name: ${GRAFANA_DATA_VOLUME:-logcollector-grafana-data}
