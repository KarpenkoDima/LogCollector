name: logcollector

# Production: один collector и одно первичное SQLite-хранилище.
# Monitoring подключается отдельным override-файлом и расширяет этот же сервис.

x-log-options: &log-options
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  logcollector:
    image: ${LOGCOLLECTOR_IMAGE:-logcollector:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    # Даём Generic Host время остановить UDP listener и сохранить хвост очереди.
    stop_grace_period: 30s

    ports:
      # host 514/udp -> container 5140/udp
      # Для rootless Docker задайте SYSLOG_HOST_PORT=5140 в .env.
      - "${SYSLOG_HOST_IP:-0.0.0.0}:${SYSLOG_HOST_PORT:-514}:5140/udp"

    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_EnableDiagnostics: "0"

      # Имена соответствуют текущему коду проекта:
      # configuration.GetSection("SyslogListener")
      SyslogListener__Port: "5140"
      SyslogListener__MaxDatagramSize: "8192"

      BatchWriter__BatchSize: "500"
      BatchWriter__BatchTimeout: "00:00:02"

      # SQLite — обязательный PRIMARY sink. Loki добавляется только monitoring-файлом.
      LogSinks__0__Type: Sqlite
      LogSinks__0__ConnectionString: >-
        Data Source=/app/data/logs.db;Cache=Shared

    volumes:
      - logcollector-data:/app/data

    # Immutable root filesystem: писать разрешено только в volume и /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

    # Это защитные границы, а не результаты benchmark. Меняйте после измерений.
    mem_limit: ${LOGCOLLECTOR_MEMORY_LIMIT:-256m}
    cpus: ${LOGCOLLECTOR_CPUS:-1.0}

    networks:
      - logcollector-net
    logging: *log-options

    # Фиктивного healthcheck вида `pgrep dotnet` нет: живой PID не доказывает,
    # что UDP socket bound, SQLite доступна и background writer исправен.

volumes:
  logcollector-data:
    name: ${LOGCOLLECTOR_DATA_VOLUME:-logcollector-data}

networks:
  logcollector-net:
    name: ${LOGCOLLECTOR_NETWORK:-logcollector-net}
    driver: bridge
