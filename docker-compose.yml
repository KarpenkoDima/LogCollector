name: logcollector

services:
  logcollector:
    build:
      context: .
      dockerfile: Dockerfile
    image: logcollector:local
    restart: unless-stopped
    read_only: true
    ports:
      - "514:5140/udp"
    volumes:
      - logcollector-data:/app/data
    tmpfs:
      - /tmp:size=8m,mode=1777
    environment:
      UDPListener__Port: "5140"
      SQLite__ConnectionString: "Data Source=/app/data/logs.db;Cache=Shared"
    mem_limit: 128m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

volumes:
  logcollector-data:
